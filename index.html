<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login_Registeration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet"href="https://fonts.googleapis.com/css?family=Poppins">

</head>


<body>


<div class="container">
<div class="form-box">
<h1 class="title">Sign Up</h1>
<div class="underline"> </div>

<form>
<div class="input-group">
<div class="input-field namefield">
<i class="fa-solid fa-user"></i>    
<input type="text" placeholder="name">
</div> <!--End input-field--> 


<div class="input-field">
<i class="fa-solid fa-at"></i>   
<input type="email" placeholder="Email">
</div> <!--End input-field--> 


<div class="input-field">
<i class="fa-solid fa-key"></i>   
<input type="password" placeholder="Password">
</div> <!--End input-field--> 
<p><span class="text">Password Suggestions</span> <a href="#">Click Here!</a></p>


</div><!--End input-group-->

<div class="btn-field">
<button type="button" class="signupbtn">Sign Up</button>
<button type="button" class="disable  signinbtn">Sign in</button>
</div><!--End btn-field-->
</form> 
</div> <!--End form-box div  -->
</div><!--End container div  -->

<script src="script.js"></script>
</body>


</html>
